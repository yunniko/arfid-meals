services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arfid
      POSTGRES_PASSWORD: arfid
      POSTGRES_DB: arfid_meals
    ports:
      - "127.0.0.1:54323:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arfid -d arfid_meals"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Production-style app container — opt in with:
  #   docker compose --profile app up -d --build
  # (dev flow stays `docker compose up -d db` + `npm run dev`)

  # One-shot migration runner (full node_modules from the build stage)
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: build
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://arfid:arfid@db:5432/arfid_meals

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://arfid:arfid@db:5432/arfid_meals
      # Interpolated from .env in this directory (or the shell environment)
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Empty AUTH_URL breaks Auth.js host trust (it treats "" as
      # configured), so default to the local deploy URL; a real
      # deployment sets APP_URL.
      AUTH_URL: ${APP_URL:-http://localhost:30030}
      AUTH_TRUST_HOST: "true"
      APP_URL: ${APP_URL:-http://localhost:30030}
      # First sign-in with this email is promoted to ADMIN (see
      # src/auth.ts) — set once, then flip ADMIN_BOOTSTRAP_ENABLED to
      # "false" once the real admin account exists.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-true}
    ports:
      # Port 30030: verified free on the live host 2026-09-03 (30000,
      # 30010, and 30020 were already taken — 30020 by crochet-simulator,
      # not reflected in COMPANY/INFRASTRUCTURE.md's registry snapshot).
      - "127.0.0.1:30030:3000"

volumes:
  db-data:
